<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - Genre (Grid)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <style>
      /* 폰트 정의 */
      @font-face {
        font-family: "SBAggro_L";
        src: url("assets/fonts/SBAggroOTF_L.ttf") format("truetype");
      }
      @font-face {
        font-family: "GmarketSansTTFMedium";
        src: url("assets/fonts/GmarketSansTTFMedium.ttf") format("truetype");
      }

      .section-title {
        font-family: "GmarketSansTTFMedium";
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0;
      }

      /* 섹션 폭 80%, 중앙 정렬 */
      .genre-books {
        width: 80%;
        margin: 0 auto;
      }

      /* [심화 F310] CSS Grid 갤러리형 배치 (04-genre_list.html의 Flexbox 확장) */
      .genre-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr 1.5fr 1fr 1fr;
        grid-auto-rows: 160px;
        gap: 0.7rem;
        /* 이름 붙인 영역으로 아이템마다 다른 크기(span) 지정 */
        grid-template-areas:
          "travel  travel     health  art     art"
          "travel  travel     health  history history"
          "romance philosophy health  baby    youth"
          "romance philosophy science economy economy";
      }
      .genre-item {
        position: relative;
        overflow: hidden;
        border-radius: 0.3rem;
      }
      .genre-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .genre-item .genre-name {
        position: absolute;
        left: 0.6rem;
        bottom: 0.5rem;
        color: #fff;
        font-family: "SBAggro_L";
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      .genre-travel {
        grid-area: travel; /* 2열 x 2행 */
      }
      .genre-health {
        grid-area: health; /* 1열 x 3행 */
      }
      .genre-art {
        grid-area: art; /* 2열 x 1행 */
      }
      .genre-history {
        grid-area: history;
      }
      .genre-economy {
        grid-area: economy;
      }
      .genre-philosophy {
        grid-area: philosophy; /* 1열 x 2행 */
      }
      .genre-science {
        grid-area: science;
      }
      .genre-baby {
        grid-area: baby;
      }
      .genre-youth {
        grid-area: youth;
      }
      .genre-romance {
        grid-area: romance;
      }

      /* 576px 미만: 1열, 정사각형 아이템 */
      @media (max-width: 575.98px) {
        .genre-grid {
          grid-template-columns: 1fr;
          grid-template-areas: none;
          grid-auto-rows: auto;
          gap: 1rem;
        }
        .genre-grid .genre-item {
          grid-area: auto;
          aspect-ratio: 1 / 1;
        }
      }

      /* 320px 화면에서도 150px 표지가 화면 밖으로 밀리지 않도록 처리 */
      @media (max-width: 359.98px) {
        .bestseller .book { flex: 0 0 100%; width: 100%; }
      }
      @media (min-width: 992px) {
        .bestseller-container { background: #fff; padding: 2rem 1rem;
          border-radius: 0.5rem; box-shadow: 0 0.5rem 2rem rgba(0,0,0,0.08); }
      }
      @media (max-width: 575.98px) {
        .navbar-collapse { background: rgba(0,0,0,0.92); padding: 1rem; border-radius: 0.4rem; }
        .hero-content { padding: 5rem 1rem; }
      }
    </style>
  </head>
  <body>
    <section class="genre-books py-5">
      <h3 class="section-title text-center mb-4">장르별 도서 목록</h3>
      <div class="genre-grid">
        <div class="genre-item genre-travel">
          <img src="assets/genre/travel.jpg" alt="여행" />
          <span class="genre-name">여행</span>
        </div>
        <div class="genre-item genre-health">
          <img src="assets/genre/health.jpg" alt="건강" />
          <span class="genre-name">건강</span>
        </div>
        <div class="genre-item genre-art">
          <img src="assets/genre/art.jpg" alt="예술" />
          <span class="genre-name">예술</span>
        </div>
        <div class="genre-item genre-history">
          <img src="assets/genre/history.jpg" alt="역사" />
          <span class="genre-name">역사</span>
        </div>
        <div class="genre-item genre-economy">
          <img src="assets/genre/economy.jpg" alt="경제" />
          <span class="genre-name">경제</span>
        </div>
        <div class="genre-item genre-philosophy">
          <img src="assets/genre/philosophy.jpg" alt="철학" />
          <span class="genre-name">철학</span>
        </div>
        <div class="genre-item genre-science">
          <img src="assets/genre/natural_science.jpg" alt="자연과학" />
          <span class="genre-name">자연과학</span>
        </div>
        <div class="genre-item genre-baby">
          <img src="assets/genre/baby.jpg" alt="육아" />
          <span class="genre-name">육아</span>
        </div>
        <div class="genre-item genre-youth">
          <img src="assets/genre/youth.jpg" alt="청소년" />
          <span class="genre-name">청소년</span>
        </div>
        <div class="genre-item genre-romance">
          <img src="assets/genre/romance.jpg" alt="로맨스" />
          <span class="genre-name">로맨스</span>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
