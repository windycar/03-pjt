<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - AI recommendation</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      /* 폰트 정의 */
      @font-face {
        font-family: "SBAggroOTF_L";
        src: url("assets/fonts/SBAggroOTF_L.ttf") format("truetype");
      }
      @font-face {
        font-family: "GmarketSansTTFMedium";
        src: url("assets/fonts/GmarketSansTTFMedium.ttf") format("truetype");
      }
      body {
        margin: 0;
        padding: 0;
        color: #333;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }
      .ai-recommendation {
        width: 80%;
        margin: 0 auto;
      }
      .section-title {
        font-family: "GmarketSansTTFMedium";
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0;
      }
      /* "활동 데이터 기반" 강조 */
      .ai-recommendation .highlight {
        color: #fe4a51;
        font-family: "SBAggroOTF_L";
        font-size: 1.3rem;
      }

      /* 320px 화면에서도 150px 표지가 화면 밖으로 밀리지 않도록 처리 */
      @media (max-width: 359.98px) {
        .bestseller .book { flex: 0 0 100%; width: 100%; }
      }
      @media (min-width: 992px) {
        .bestseller-container { background: #fff; padding: 2rem 1rem;
          border-radius: 0.5rem; box-shadow: 0 0.5rem 2rem rgba(0,0,0,0.08); }
      }
      @media (max-width: 575.98px) {
        .navbar-collapse { background: rgba(0,0,0,0.92); padding: 1rem; border-radius: 0.4rem; }
        .hero-content { padding: 5rem 1rem; }
      }
    </style>
  </head>
  <body>
    <!-- AI 추천 섹션 -->
    <section class="py-5">
      <div class="ai-recommendation">

        <div class="row align-items-center">
          <!-- 좌측: 도서 이미지 영역 -->
          <div
            class="col-12 col-sm-7 d-flex flex-wrap justify-content-center align-items-center"
          >
            <img
              src="assets/ai_recommendation/img1.jpeg"
              alt="Bauhaus"
              class="img-fluid me-3 mt-3"
              style="max-width: 120px; min-height: 180px"
            />
            <img
              src="assets/ai_recommendation/img2.jpeg"
              alt="Mastering AI"
              class="img-fluid me-3"
              style="width: 140px; height: 210px"
            />
            <img
              src="assets/ai_recommendation/img3.jpeg"
              alt="Design"
              class="img-fluid me-3 mt-3"
              style="max-width: 120px; min-height: 180px"
            />
          </div>
          <!-- 우측: 서비스 소개 텍스트 영역 -->
          <div class="col-12 col-sm-5 mt-4 mt-sm-0">
            <h3 class="mb-3 section-title">AI 추천</h3>
            <p class="text-muted">구매 목록, 감명 깊게 읽은 도서 등</p>
            <p class="text-muted">
              사용자 <span class="highlight">활동 데이터 기반</span> 인공지능
              도서 추천
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
