<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - Bestseller</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <style>
      /* 폰트 정의 */
      @font-face {
        font-family: "SBAggro_L";
        src: url("assets/fonts/SBAggroOTF_L.ttf") format("truetype");
      }
      @font-face {
        font-family: "GmarketSansTTFMedium";
        src: url("assets/fonts/GmarketSansTTFMedium.ttf") format("truetype");
      }

      body {
        margin: 0;
        padding: 0;
        color: #333;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }
      .section-title {
        font-family: "GmarketSansTTFMedium";
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0;
      }

      /* 도서 표지 + 제목 */
      .bestseller .book {
        text-align: center;
      }
      .bestseller .book img {
        width: 150px;
        height: 220px;
        object-fit: cover;
      }
      .bestseller .book-title {
        width: 150px;
        min-height: 2.8em;
        margin: 0.5rem auto 0;
        font-size: 0.9rem;
        line-height: 1.4;
        color: #555;
      }

      /* Next 버튼: 흰 배경에서도 보이도록 붉은 원형 버튼으로 */
      .bestseller .carousel-control-next {
        width: auto;
        opacity: 1;
      }
      .bestseller .carousel-control-next-icon {
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 50%;
        background-color: rgba(254, 74, 81, 0.7);
        background-size: 50%;
      }

      /* 320px 화면에서도 150px 표지가 화면 밖으로 밀리지 않도록 처리 */
      @media (max-width: 359.98px) {
        .bestseller .book { flex: 0 0 100%; width: 100%; }
      }
      @media (min-width: 992px) {
        .bestseller-container { background: #fff; padding: 2rem 1rem;
          border-radius: 0.5rem; box-shadow: 0 0.5rem 2rem rgba(0,0,0,0.08); }
      }
      @media (max-width: 575.98px) {
        .navbar-collapse { background: rgba(0,0,0,0.92); padding: 1rem; border-radius: 0.4rem; }
        .hero-content { padding: 5rem 1rem; }
      }
    </style>
  </head>
  <body>
    <!-- 베스트셀러 섹션 -->
    <section class="bestseller py-5">
      <div class="container bestseller-container">
        <div class="row align-items-center">
          <!-- 좌측: 섹션 제목 -->
          <div class="col-12 col-lg-3 text-center mb-4 mb-lg-0">
            <h3 class="section-title">베스트셀러</h3>
          </div>

          <!-- 우측: 도서 Carousel -->
          <div class="col-12 col-lg-9">
            <div
              id="bestsellerCarousel"
              class="carousel slide"
              data-bs-ride="carousel"
            >
              <div class="carousel-inner">
                <!-- 슬라이드 1 -->
                <div class="carousel-item active">
                  <div class="row gx-0 gy-3">
                    <div class="col-6 col-lg-3 book">
                      <img src="assets/bestsellers/img1.jpeg" alt="소년이 온다" />
                      <p class="book-title">소년이 온다</p>
                    </div>
                    <div class="col-6 col-lg-3 book">
                      <img src="assets/bestsellers/img2.jpeg" alt="채식주의자" />
                      <p class="book-title">채식주의자</p>
                    </div>
                    <div class="col-6 col-lg-3 book">
                      <img src="assets/bestsellers/img3.jpeg" alt="대온실 수리 보고서" />
                      <p class="book-title">대온실 수리 보고서</p>
                    </div>
                    <div class="col-6 col-lg-3 book">
                      <img src="assets/bestsellers/img4.jpeg" alt="급류" />
                      <p class="book-title">급류</p>
                    </div>
                  </div>
                </div>
                <!-- 슬라이드 2 -->
                <div class="carousel-item">
                  <div class="row gx-0 gy-3">
                    <div class="col-6 col-lg-3 book">
                      <img src="assets/bestsellers/img5.jpeg" alt="시간의 계곡" />
                      <p class="book-title">시간의 계곡</p>
                    </div>
                    <div class="col-6 col-lg-3 book">
                      <img src="assets/bestsellers/img6.jpeg" alt="인간 실격" />
                      <p class="book-title">인간 실격</p>
                    </div>
                    <div class="col-6 col-lg-3 book">
                      <img src="assets/bestsellers/img7.jpeg" alt="노르웨이의 숲" />
                      <p class="book-title">노르웨이의 숲</p>
                    </div>
                    <div class="col-6 col-lg-3 book">
                      <img src="assets/bestsellers/img8.jpeg" alt="정원에 대하여" />
                      <p class="book-title">정원에 대하여</p>
                    </div>
                  </div>
                </div>
                <!-- 슬라이드 3 -->
                <div class="carousel-item">
                  <div class="row gx-0 gy-3">
                    <div class="col-6 col-lg-3 book">
                      <img src="assets/bestsellers/img9.jpeg" alt="네 칼이 센가, 내 칼이 센가" />
                      <p class="book-title">네 칼이 센가, 내 칼이 센가</p>
                    </div>
                    <div class="col-6 col-lg-3 book">
                      <img src="assets/bestsellers/img10.jpeg" alt="새벽의 사원" />
                      <p class="book-title">새벽의 사원</p>
                    </div>
                    <div class="col-6 col-lg-3 book">
                      <img src="assets/bestsellers/img11.jpeg" alt="위싱 머신" />
                      <p class="book-title">위싱 머신</p>
                    </div>
                    <div class="col-6 col-lg-3 book">
                      <img src="assets/bestsellers/img12.jpeg" alt="모순" />
                      <p class="book-title">모순</p>
                    </div>
                  </div>
                </div>
              </div>
              <!-- Next 버튼만 출력 (Prev 버튼 없음) -->
              <button
                class="carousel-control-next"
                type="button"
                data-bs-target="#bestsellerCarousel"
                data-bs-slide="next"
              >
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">다음</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
